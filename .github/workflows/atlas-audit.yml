name: Atlas JP audit

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: atlas-jp-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas_audit
          POSTGRES_USER: atlas_audit
          POSTGRES_PASSWORD: atlas_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_audit -d atlas_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pnpm install --frozen-lockfile
      - name: Configure scoped GitHub push
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Replay, audit, and publish verified Atlas input
        run: pnpm --filter @fgo-lab/data-audit audit-run "$RUNNER_TEMP/atlas-jp-${GITHUB_RUN_ID}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
