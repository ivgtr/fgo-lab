<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FGO Lab — 概念礼装管理</title>
  <style>
    :root { --page:#f5f3f0; --surface:#fff; --text:#201d1b; --muted:#746d67; --line:#d8d2cc; --soft:#ece7e2; --accent:#982b3d; --selected:#fbf1f3; --good:#326246; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; line-height:1.45; }
    button,input,select { font:inherit; }
    button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible { outline:3px solid #d88b97; outline-offset:2px; }
    button { color:inherit; }
    .app-header { background:var(--surface); border-bottom:1px solid var(--line); }
    .app-header-inner { width:min(1180px,calc(100% - 32px)); min-height:62px; margin:auto; display:flex; align-items:center; gap:28px; }
    .brand { flex:0 0 auto; font:700 22px Georgia,"Times New Roman",serif; }
    .global-nav { display:flex; align-self:stretch; gap:3px; overflow:auto; }
    .global-nav a { display:flex; align-items:center; flex:0 0 auto; padding:3px 10px 0; border-bottom:2px solid transparent; color:var(--muted); font-size:13px; text-decoration:none; }
    .global-nav a[aria-current="page"] { border-bottom-color:var(--accent); color:var(--accent); font-weight:700; }
    .save-state { margin-left:auto; color:var(--good); font-size:12px; white-space:nowrap; }
    main { width:min(1180px,calc(100% - 32px)); margin:0 auto 52px; background:var(--surface); }
    .section-tabs { display:flex; min-height:48px; padding:0 20px; border-bottom:1px solid var(--line); }
    .section-tabs a { display:flex; align-items:center; padding:3px 12px 0; border-bottom:2px solid transparent; color:var(--muted); font-size:13px; text-decoration:none; }
    .section-tabs a[aria-current="page"] { border-bottom-color:var(--accent); color:var(--accent); font-weight:700; }
    .page-head { display:flex; justify-content:space-between; gap:20px; align-items:end; padding:25px 20px 18px; }
    h1 { margin:0 0 4px; font-size:27px; }
    .page-head p { margin:0; color:var(--muted); font-size:13px; }
    .primary { min-height:40px; padding:8px 13px; border:1px solid var(--accent); border-radius:4px; background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap; }
    .toolbar { padding:13px 20px; border-block:1px solid var(--line); }
    .toolbar input { width:100%; min-height:42px; padding:8px 11px; border:1px solid #bfb8b1; border-radius:4px; background:#fff; }
    .workspace { display:grid; grid-template-columns:minmax(520px,1.6fr) minmax(330px,.8fr); border-bottom:1px solid var(--line); }
    .list-pane { min-width:0; }
    .list-head { display:flex; justify-content:space-between; padding:10px 16px 8px 20px; border-bottom:1px solid var(--soft); color:var(--muted); font-size:12px; }
    .ce-row { display:grid; grid-template-columns:52px minmax(0,1fr) auto 16px; gap:11px; align-items:center; width:100%; min-height:70px; padding:8px 15px 8px 20px; border:0; border-bottom:1px solid var(--soft); background:#fff; text-align:left; cursor:pointer; }
    .ce-row:hover { background:#faf8f6; }
    .ce-row[aria-current="true"] { background:var(--selected); box-shadow:inset 3px 0 var(--accent); }
    .ce-image { width:50px; height:50px; object-fit:cover; border:1px solid var(--line); }
    .ce-copy strong,.ce-copy span { display:block; }
    .ce-copy strong { font-size:14px; }
    .ce-copy span { color:var(--muted); font-size:11px; }
    .row-value { text-align:right; }
    .row-value strong,.row-value span { display:block; }
    .row-value strong { font-size:14px; font-variant-numeric:tabular-nums; }
    .row-value span { color:var(--muted); font-size:11px; }
    .chevron { color:var(--muted); }
    .empty { padding:54px 24px; text-align:center; }
    .empty h2 { margin:0 0 5px; font-size:18px; }
    .empty p { margin:0 0 18px; color:var(--muted); font-size:13px; }
    .empty[hidden] { display:none; }
    .no-results { margin:0; padding:34px 20px; color:var(--muted); font-size:13px; text-align:center; }
    .no-results[hidden] { display:none; }
    .detail { min-width:0; padding:18px 20px 22px; border-left:1px solid var(--line); }
    .detail-inner { position:sticky; top:18px; }
    .mobile-back { display:none; padding:0; border:0; background:transparent; color:var(--accent); cursor:pointer; }
    .detail-person { display:flex; gap:12px; align-items:center; padding-bottom:15px; border-bottom:1px solid var(--line); }
    .detail-person .ce-image { width:58px; height:58px; }
    .detail-person h2 { margin:0 0 2px; font-size:18px; }
    .detail-person p { margin:0; color:var(--muted); font-size:12px; }
    .editor { padding-top:15px; }
    .field { display:grid; grid-template-columns:110px minmax(0,1fr); gap:12px; align-items:center; min-height:48px; border-bottom:1px solid var(--soft); }
    .field label,.field > span:first-child { color:var(--muted); font-size:12px; }
    .field input,.field select { width:100%; min-height:38px; padding:6px 8px; border:1px solid #bfb8b1; border-radius:4px; background:#fff; }
    .number { font-weight:700; font-variant-numeric:tabular-nums; }
    .shortcuts { display:flex; gap:6px; margin:10px 0 18px 122px; }
    .quiet-button { min-height:34px; padding:5px 9px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; }
    .detail-actions { padding-top:16px; border-top:1px solid var(--line); }
    .add-same { width:100%; min-height:39px; padding:7px 10px; border:1px solid var(--accent); border-radius:4px; background:#fff; color:var(--accent); cursor:pointer; }
    .remove { display:block; margin:14px auto 0; padding:0; border:0; background:transparent; color:var(--muted); text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
    dialog { width:min(660px,calc(100% - 24px)); max-height:min(720px,calc(100vh - 32px)); padding:0; border:1px solid var(--line); background:#fff; color:var(--text); }
    dialog::backdrop { background:rgba(28,25,23,.42); }
    .dialog-head { display:flex; justify-content:space-between; align-items:center; padding:15px 17px; border-bottom:1px solid var(--line); }
    .dialog-head h2 { margin:0; font-size:19px; }
    .dialog-close { width:36px; height:36px; border:1px solid var(--line); border-radius:4px; background:#fff; cursor:pointer; }
    .dialog-search { padding:12px 17px; border-bottom:1px solid var(--line); }
    .dialog-search input { width:100%; min-height:41px; padding:8px 10px; border:1px solid #bfb8b1; border-radius:4px; }
    .catalog-option { display:grid; grid-template-columns:52px minmax(0,1fr) auto; gap:11px; align-items:center; width:100%; min-height:70px; padding:8px 17px; border:0; border-bottom:1px solid var(--soft); background:#fff; text-align:left; cursor:pointer; }
    .catalog-option:hover { background:#faf8f6; }
    .catalog-option strong,.catalog-option span { display:block; }
    .catalog-option span { color:var(--muted); font-size:12px; }
    .catalog-option b { color:var(--accent); font-size:12px; }
    .toast { position:fixed; z-index:10; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:9px 12px; background:#2c2927; color:#fff; font-size:13px; }
    .toast button { padding:0; border:0; background:transparent; color:#fff; text-decoration:underline; cursor:pointer; }
    .toast[hidden] { display:none; }
    .visually-hidden { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:820px) {
      .app-header-inner,main { width:100%; }
      .app-header-inner { padding-left:14px; }
      .save-state { display:none; }
      .workspace { display:block; }
      .detail { border-left:0; }
      .workspace:not(.detail-open) .detail { display:none; }
      .workspace.detail-open .list-pane { display:none; }
      .detail-inner { position:static; }
      .mobile-back { display:inline-block; margin-bottom:19px; }
    }
    @media (max-width:480px) {
      .app-header-inner { display:block; padding-top:11px; }
      .brand { padding-left:2px; }
      .global-nav { min-height:42px; margin-top:3px; }
      .global-nav a { padding-inline:7px; font-size:12px; }
      .section-tabs { padding-inline:8px; }
      .page-head { display:block; padding:21px 15px 15px; }
      h1 { font-size:24px; }
      .page-head .primary { width:100%; margin-top:15px; }
      .toolbar { padding-inline:15px; }
      .list-head { padding-left:15px; }
      .ce-row { padding-left:15px; grid-template-columns:48px minmax(0,1fr) auto 12px; }
      .ce-image { width:46px; height:46px; }
      .row-value span { display:none; }
      .detail { padding-inline:15px; }
      .field { grid-template-columns:92px minmax(0,1fr); }
      .shortcuts { margin-left:104px; }
    }
  </style>
</head>
<body>
  <header class="app-header"><div class="app-header-inner"><div class="brand">FGO Lab</div><nav class="global-nav" aria-label="主要なページ"><a href="my-chaldea-ui-comparison.html" aria-current="page">所持・育成管理</a><a href="ui-comparison.html">ダメージ計算</a><a href="ui-comparison.html#ranking">火力ランキング</a><a href="growth-plan-ui.html">育成計画</a></nav><span class="save-state" data-save-state>端末に保存済み</span></div></header>
  <main>
    <nav class="section-tabs" aria-label="管理対象"><a href="my-chaldea-ui-comparison.html">サーヴァント</a><a href="craft-essence-ui.html" aria-current="page">概念礼装</a></nav>
    <header class="page-head"><div><h1>概念礼装</h1><p>計算や編成で使う礼装を、1枚ずつ登録します。</p></div><button class="primary" type="button" data-open-register>概念礼装を登録</button></header>
    <div class="toolbar"><label><span class="visually-hidden">登録済み概念礼装を検索</span><input type="search" placeholder="登録済み礼装を検索" data-list-search /></label></div>
    <div class="workspace" data-workspace>
      <section class="list-pane" aria-label="登録済み概念礼装">
        <div class="list-head"><span>登録済み</span><span data-count></span></div>
        <div data-copy-list></div>
        <p class="no-results" data-list-no-results hidden>一致する登録済み礼装はありません。</p>
        <section class="empty" data-empty hidden><h2>登録済みの概念礼装はありません</h2><p>計算で使う礼装だけを登録できます。</p><button class="primary" type="button" data-open-register>最初の概念礼装を登録</button></section>
      </section>
      <aside class="detail" data-detail aria-live="polite"><div class="detail-inner">
        <button class="mobile-back" type="button" data-back>← 概念礼装一覧へ戻る</button>
        <div class="detail-person"><img class="ce-image" data-detail-image src="" alt="" /><div><h2 data-detail-name></h2><p data-detail-meta></p></div></div>
        <div class="editor">
          <div class="field"><label for="stage">限界突破</label><select id="stage" data-stage><option value="0">未解放</option><option value="1">1回</option><option value="2">2回</option><option value="3">3回</option><option value="4">最大解放</option></select></div>
          <div class="field"><label for="level">レベル</label><input id="level" type="number" min="1" inputmode="numeric" data-level /></div>
          <div class="shortcuts"><button class="quiet-button" type="button" data-level-shortcut="1">Lv.1</button><button class="quiet-button" type="button" data-level-shortcut="cap">現在上限</button></div>
          <div class="field"><span>ATK</span><strong class="number" data-atk></strong></div>
        </div>
        <div class="detail-actions"><button class="add-same" type="button" data-add-same>同じ礼装をもう1枚登録</button><button class="remove" type="button" data-remove>この礼装の登録を解除</button></div>
      </div></aside>
    </div>
  </main>

  <dialog data-register-dialog aria-labelledby="register-title">
    <header class="dialog-head"><h2 id="register-title">概念礼装を登録</h2><button class="dialog-close" type="button" data-close-register aria-label="閉じる">×</button></header>
    <div class="dialog-search"><label><span class="visually-hidden">全概念礼装から検索</span><input type="search" placeholder="礼装名で検索" data-catalog-search /></label></div>
    <div data-catalog-list></div>
    <p class="no-results" data-catalog-no-results hidden>一致する概念礼装はありません。</p>
  </dialog>
  <div class="toast" role="status" data-toast hidden><span data-toast-message></span><button type="button" data-undo hidden>元に戻す</button></div>

  <script>
    const catalog = [
      { id:'black-grail', name:'黒の聖杯', rarity:'★5', image:'https://static.atlasacademy.io/JP/Faces/f_94004800.png', atkMin:600, atkMax:2400, order:1 },
      { id:'aerial-drive', name:'エアリアル・ドライブ', rarity:'★5', image:'https://static.atlasacademy.io/JP/Faces/f_94027500.png', atkMin:500, atkMax:2000, order:2 },
      { id:'golden-sumo', name:'ゴールデン相撲〜岩場所〜', rarity:'★5', image:'https://static.atlasacademy.io/JP/Faces/f_94016400.png', atkMin:500, atkMax:2000, order:3 }
    ];
    let copies = [
      { uid:'ce-1', ceId:'black-grail', stage:4, level:100 },
      { uid:'ce-2', ceId:'black-grail', stage:4, level:60 },
      { uid:'ce-3', ceId:'aerial-drive', stage:4, level:100 },
      { uid:'ce-4', ceId:'aerial-drive', stage:4, level:100 },
      { uid:'ce-5', ceId:'golden-sumo', stage:4, level:100 }
    ];
    let selectedUid = copies[0].uid;
    let nextUid = 6;
    let removedCopy = null;
    let toastTimer;
    const caps = [20,40,60,80,100];
    const workspace = document.querySelector('[data-workspace]');
    const list = document.querySelector('[data-copy-list]');
    const listSearch = document.querySelector('[data-list-search]');
    const dialog = document.querySelector('[data-register-dialog]');
    const catalogSearch = document.querySelector('[data-catalog-search]');
    const stageInput = document.querySelector('[data-stage]');
    const levelInput = document.querySelector('[data-level]');
    const toast = document.querySelector('[data-toast]');

    function ceFor(copy) { return catalog.find((ce) => ce.id === copy.ceId); }
    function stageLabel(stage) { return stage === 4 ? '最大解放' : stage === 0 ? '未解放' : `${stage}回解放`; }
    function atkFor(copy) {
      const ce = ceFor(copy);
      return Math.floor(ce.atkMin + (ce.atkMax - ce.atkMin) * ((copy.level - 1) / 99));
    }
    function duplicateLabel(copy) {
      const same = copies.filter((item) => item.ceId === copy.ceId && item.stage === copy.stage && item.level === copy.level);
      if (same.length < 2) return '';
      return `・${same.findIndex((item) => item.uid === copy.uid) + 1}枚目`;
    }
    function announce(message, undo = false) {
      clearTimeout(toastTimer);
      document.querySelector('[data-toast-message]').textContent = message;
      document.querySelector('[data-undo]').hidden = !undo;
      toast.hidden = false;
      toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
    }
    function markSaving() {
      const state = document.querySelector('[data-save-state]');
      state.textContent = '端末に保存中…';
      setTimeout(() => { state.textContent = '端末に保存済み'; }, 360);
    }
    function renderList() {
      const query = listSearch.value.trim().toLocaleLowerCase('ja');
      const visible = copies.slice().sort((a,b) => ceFor(a).order - ceFor(b).order || a.uid.localeCompare(b.uid)).filter((copy) => ceFor(copy).name.toLocaleLowerCase('ja').includes(query));
      list.replaceChildren(...visible.map((copy) => {
        const ce = ceFor(copy);
        const row = document.createElement('button');
        row.type = 'button'; row.className = 'ce-row'; row.dataset.uid = copy.uid;
        if (copy.uid === selectedUid) row.setAttribute('aria-current','true');
        row.innerHTML = `<img class="ce-image" src="${ce.image}" alt=""><span class="ce-copy"><strong>${ce.name}</strong><span>${stageLabel(copy.stage)}・Lv.${copy.level}${duplicateLabel(copy)}</span></span><span class="row-value"><strong>ATK ${atkFor(copy).toLocaleString()}</strong><span>${ce.rarity}</span></span><span class="chevron">›</span>`;
        row.addEventListener('click', () => selectCopy(copy.uid, true));
        return row;
      }));
      document.querySelector('[data-count]').textContent = `${copies.length}枚`;
      document.querySelector('[data-empty]').hidden = copies.length !== 0 || Boolean(query);
      document.querySelector('[data-list-no-results]').hidden = copies.length === 0 || visible.length !== 0;
    }
    function renderDetail() {
      const copy = copies.find((item) => item.uid === selectedUid);
      document.querySelector('[data-detail]').hidden = !copy;
      if (!copy) return;
      const ce = ceFor(copy);
      document.querySelector('[data-detail-image]').src = ce.image;
      document.querySelector('[data-detail-name]').textContent = ce.name;
      document.querySelector('[data-detail-meta]').textContent = `${ce.rarity}・登録済みの1枚`;
      stageInput.value = copy.stage;
      levelInput.max = caps[copy.stage]; levelInput.value = copy.level;
      document.querySelector('[data-atk]').textContent = atkFor(copy).toLocaleString();
    }
    function selectCopy(uid, openMobile = false) {
      selectedUid = uid; renderList(); renderDetail();
      if (openMobile && matchMedia('(max-width:820px)').matches) { workspace.classList.add('detail-open'); document.querySelector('[data-back]').focus(); }
    }
    function addCopy(ceId) {
      const copy = { uid:`ce-${nextUid++}`, ceId, stage:0, level:1 };
      copies.push(copy); selectCopy(copy.uid); markSaving(); announce(`${ceFor(copy).name}を登録しました`);
    }
    function renderCatalog() {
      const query = catalogSearch.value.trim().toLocaleLowerCase('ja');
      const visible = catalog.filter((ce) => ce.name.toLocaleLowerCase('ja').includes(query));
      document.querySelector('[data-catalog-list]').replaceChildren(...visible.map((ce) => {
        const option = document.createElement('button'); option.type = 'button'; option.className = 'catalog-option';
        option.innerHTML = `<img class="ce-image" src="${ce.image}" alt=""><span><strong>${ce.name}</strong><span>${ce.rarity}・登録済み ${copies.filter((copy) => copy.ceId === ce.id).length}枚</span></span><b>登録</b>`;
        option.addEventListener('click', () => { addCopy(ce.id); dialog.close(); });
        return option;
      }));
      document.querySelector('[data-catalog-no-results]').hidden = visible.length !== 0;
    }
    document.querySelectorAll('[data-open-register]').forEach((button) => button.addEventListener('click', () => { catalogSearch.value=''; renderCatalog(); dialog.showModal(); setTimeout(() => catalogSearch.focus()); }));
    document.querySelector('[data-close-register]').addEventListener('click', () => dialog.close());
    catalogSearch.addEventListener('input', renderCatalog);
    listSearch.addEventListener('input', renderList);
    stageInput.addEventListener('change', () => {
      const copy = copies.find((item) => item.uid === selectedUid); copy.stage = Number(stageInput.value); copy.level = Math.min(copy.level,caps[copy.stage]); renderList(); renderDetail(); markSaving();
    });
    levelInput.addEventListener('change', () => {
      const copy = copies.find((item) => item.uid === selectedUid); copy.level = Math.max(1,Math.min(Number(levelInput.value),caps[copy.stage])); renderList(); renderDetail(); markSaving();
    });
    document.querySelectorAll('[data-level-shortcut]').forEach((button) => button.addEventListener('click', () => {
      const copy = copies.find((item) => item.uid === selectedUid); copy.level = button.dataset.levelShortcut === 'cap' ? caps[copy.stage] : 1; renderList(); renderDetail(); markSaving();
    }));
    document.querySelector('[data-add-same]').addEventListener('click', () => addCopy(copies.find((item) => item.uid === selectedUid).ceId));
    document.querySelector('[data-remove]').addEventListener('click', () => {
      const index = copies.findIndex((item) => item.uid === selectedUid); removedCopy = { copy:copies[index], index }; copies.splice(index,1);
      selectedUid = copies[Math.min(index,copies.length - 1)]?.uid || null; renderList(); renderDetail(); markSaving(); announce('概念礼装の登録を解除しました',true);
      if (matchMedia('(max-width:820px)').matches) workspace.classList.remove('detail-open');
    });
    document.querySelector('[data-undo]').addEventListener('click', () => { if (!removedCopy) return; copies.splice(removedCopy.index,0,removedCopy.copy); selectCopy(removedCopy.copy.uid); removedCopy=null; toast.hidden=true; markSaving(); });
    document.querySelector('[data-back]').addEventListener('click', () => { workspace.classList.remove('detail-open'); document.querySelector(`.ce-row[data-uid="${selectedUid}"]`)?.focus(); });
    if (matchMedia('(max-width:480px)').matches) { const nav=document.querySelector('.global-nav'); nav.scrollLeft=nav.scrollWidth; }
    renderList(); renderDetail();
  </script>
</body>
</html>
