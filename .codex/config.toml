[agents]
# This repository normally uses one parent agent. An exception permits only one
# bounded read-only investigation, and the project default keeps that work cheap.
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--context", "codex", "--add-mode", "no-onboarding", "--project-from-cwd", "--enable-web-dashboard", "false", "--open-web-dashboard", "false"]
startup_timeout_sec = 60
tool_timeout_sec = 120
